<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messenger Folders</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="mf-popup-header">
    <div class="mf-logo">
      <span class="mf-logo-icon">📁</span>
      <h1>Messenger Folders</h1>
    </div>
    <span class="mf-version">v1.0.0</span>
  </header>

  <main class="mf-popup-content">
    <section class="mf-section">
      <div class="mf-section-header">
        <h2>Twoje foldery</h2>
        <button id="btn-add-folder-toggle" class="mf-btn-secondary" type="button">+ Dodaj folder</button>
      </div>

      <!-- Formularz dodawania folderu -->
      <form id="form-new-folder" class="mf-form-add hidden">
        <div class="mf-form-group">
          <label for="folder-name">Nazwa folderu</label>
          <input type="text" id="folder-name" placeholder="np. Studia, Rodzina" required maxlength="25">
        </div>

        <div class="mf-form-row">
          <div class="mf-form-group">
            <label for="folder-icon">Ikona / Emoji</label>
            <input type="text" id="folder-icon" value="📁" maxlength="2">
          </div>
          <div class="mf-form-group">
            <label for="folder-color">Kolor</label>
            <input type="color" id="folder-color" value="#0084FF">
          </div>
        </div>

        <div class="mf-form-actions">
          <button type="submit" class="mf-btn-primary">Zapisz</button>
          <button type="button" id="btn-cancel-add" class="mf-btn-text">Anuluj</button>
        </div>
      </form>

      <!-- Lista folderów -->
      <ul id="folder-list" class="mf-folder-list"></ul>
    </section>

    <!-- Sekcja kopii zapasowej -->
    <section class="mf-section mf-backup-section">
      <h2>Kopia zapasowa danych</h2>
      <div class="mf-backup-buttons">
        <button id="btn-export" class="mf-btn-outline" type="button">Eksportuj do pliku</button>
        <button id="btn-import" class="mf-btn-outline" type="button">Importuj z pliku</button>
        <input type="file" id="file-import-input" accept=".json" class="hidden">
      </div>
      <p id="status-message" class="mf-status-message"></p>
    </section>
  </main>

  <footer class="mf-popup-footer">
    <p>Organizuj wiadomości w prosty sposób.</p>
  </footer>

  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
