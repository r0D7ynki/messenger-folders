# Kontrola jakości przy każdym pull requeście i pushu do master.
# To samo co lokalnie: npm run verify (składnia, manifest, ESLint, testy, karty kanban).
name: verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
